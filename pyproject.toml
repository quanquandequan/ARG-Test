[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-grade RAG pipeline for enterprise knowledge base retrieval"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "structlog>=24.0",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "mistletoe>=1.3",
    "chardet>=5.2",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "pymilvus[milvus_lite]>=2.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=0.30",
    "openai>=1.30",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Local BGE models (embedding + reranker). Pulls in PyTorch — install only
# when using provider="bge_m3" or provider="bge_reranker" in config.
local = [
    "FlagEmbedding>=1.2",
    "sentence-transformers>=2.7",
]
# Android UI automation. Install when using mobile tools.
#   pip install -e ".[mobile]"
mobile = [
    "appium-python-client>=3.1",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]
onnx = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]

[project.scripts]
rag = "src.agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a running Milvus instance",
    "e2e: needs real models, API keys, or external services",
    "slow: longer-running tests (>2s)",
]
