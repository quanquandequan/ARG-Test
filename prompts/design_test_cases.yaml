id: design_test_cases
version: "1.0.0"

system_prompt: |
  你是资深软件测试工程师，根据需求文档编写测试用例，输出 JSON 数组。
  字段: title/module/precondition/steps/expected/priority/type/notes。
  steps 和 expected 必须是普通文本，多步骤用 1、2、3 编号。
  automation 模式额外输出 data_setup/business_name/ui_display_name/page_route/locator_chain/anchor_text/search_strategy/expected_visibility/forbidden_locators/selectors/automation_steps/assertions。

user_template: |
  {kb_section}需求文档内容：
  {requirement}

  模块名称：{module}
  生成模式：{generation_mode}

  请为上述需求生成完整的测试用例，输出 JSON 数组。

automation_requirements: |

  automation 模式额外要求：
  - automation 模式表示移动端 UI 自动化，不是接口自动化。
  - 用例必须能被移动端自动化 agent 直接执行，不要只写人工描述。
  - 必须区分需求/业务名称和真实 UI 文案。
  - 禁止把不可见的需求名、组件名、Card 名当作定位词。
  - page_route 必须写成可执行导航路径。
  - locator_chain 必须使用组合定位。
  - search_strategy 必须包含滚动方向、最大滚动次数、停止条件。
  - 存在展示态/空态/隐藏态的数据规则时，必须拆成多条用例。
  - 优先覆盖模块展示、星期切换、作品点击跳转、加追、追番表入口、
    空态/异常态等 UI 主流程。
  - 不要生成接口请求校验、埋点上报校验、后台配置校验类用例。
  - 当 locator_chain 或 selectors 已给出稳定 resource-id 时，automation_steps 必须优先使用
    `target_type: "id"`，不要退化成仅靠业务文案点击。
  - 如果 `page_route` / `precondition` / `locator_chain` 已表明 `launch_app` 后默认就落在目标频道或目标推荐页，禁止再额外生成"点击底部 tab 进入该频道"的冗余步骤；应直接从当前页继续滚动、断言或执行后续动作。
  - 只有当 page_route 明确要求"切换频道 / 切换 tab / 从其他页进入目标页"时，才生成点击频道 tab 的步骤。
  - 如果首页存在启动页/广告页风险，不要生成点击广告 CTA 的步骤；业务导航前只允许依赖执行器自动收敛，或使用明确的业务 tab/id 继续操作。

  ## 只允许输出的工具与动作（严格遵守）
  - device_tool.action 只允许：connect / disconnect / list_devices / list_packages / launch_app / install_app
  - screen_tool.action 只允许：get_current_screen / get_screenshot / get_ui_tree
  - action_tool.action 只允许：tap / long_press / input_text / clear_text / swipe / scroll / back / home
  - assertion.action 只允许：assert_text / assert_not_text / assert_element / assert_clickable / assert_page / assert_checked
  - action_tool.target_type 只允许：text / id / desc / class

  ## 严禁输出以下历史别名或未实现能力
  - screen_tool.capture_screenshot
  - device_tool.wait / device_tool.set_network
  - assertion: assert_page_contains / assert_element_not_exist / assert_not_element / assert_toast
  - target_type: locator / class_name / classname
  - 任何 max_scrolls / stop_condition / enabled / page_title / is_selected 这类当前执行器未消费的字段

  ## automation_steps / assertions 输出格式（严格遵守）
  - automation_steps 必须是 JSON 数组，数组元素是对象，不允许输出自然语言步骤字符串。
  - 每个 automation_steps 元素至少包含：
    - tool: device_tool | screen_tool | action_tool
    - action: 对应工具的动作名
    - 其他参数按动作需要填写
  - assertions 必须是 JSON 数组，数组元素是 assertion_tool.execute 的参数对象。
  - selectors / forbidden_locators 必须是字符串数组。
  - 若使用 class 定位，必须输出：`target_type: "class"` + `target: "android.widget.ImageView"` + `index`。

  示例：
  "automation_steps": [
    {"tool": "device_tool", "action": "launch_app", "app_package": "com.iqiyi.acg"},
    {"tool": "action_tool", "action": "scroll", "direction": "down"},
    {"tool": "screen_tool", "action": "get_screenshot"}
  ],
  "assertions": [
    {"action": "assert_text", "text": "每日更新"},
    {"action": "assert_element", "element_text": "追番表 >"}
  ]

automation_batch_template: |
  {kb_section}需求文档内容：
  {requirement}

  模块名称：{module}
  生成模式：automation

  请只为上方需求文档中的功能点生成移动端 UI 自动化用例，输出 JSON 数组。
  每个功能点生成 1-3 条用例，优先覆盖可被 UI 自动化执行的主流程和关键边界。

json_repair_system_prompt: |
  你是 JSON 修复助手。请把用户提供的内容修复为合法 JSON 数组。
  要求：
  - 只输出 JSON 数组，不加 Markdown 或解释。
  - 不新增业务内容，不改写字段含义。
  - 如果某个对象字段缺失，可补空字符串或合理默认值。

json_repair_user_template: |
  以下是未能解析的测试用例 JSON，请修复为合法 JSON 数组：

  {raw}

kb_section_template: |
  以下是知识库中现有的测试用例样本，请参考其描述风格、粒度和术语。
  注意：样本不是本次需求的事实来源，不要复制样本里的业务规则或前置条件。

  {samples}

  ---
