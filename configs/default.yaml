# RAG Pipeline — Default Configuration
# Values here apply to all environments.

app:
  name: "rag-pipeline"
  version: "0.1.0"
  debug: false
  log_level: "INFO"

embedding:
  provider: "dashscope"   # "bge_m3" (local) / "openai" / "dashscope" (千问)
  model_name: "text-embedding-v4"  # dashscope: text-embedding-v4
  base_url: null          # null = OpenAI default; set for custom endpoints
  dim: 1024               # text-embedding-v4 default dim; null = model default
  device: "cpu"           # "cpu", "cuda", "mps" (only for local models)
  normalize: true
  batch_size: 10          # DashScope limit is 10 per request
  use_onnx: false
  onnx_model_path: null

chunking:
  strategy: "chinese_aware"
  chunk_size: 512        # characters
  chunk_overlap: 100     # characters
  min_chunk_size: 50

vectordb:
  provider: "milvus"
  mode: "lite"           # "lite" or "standalone"
  uri: "./data/milvus_lite/milvus.db"  # relative to project root; override via env-specific config
  collection_name: "knowledge_base"
  dim: 1024              # Must match embedding dim: bge-m3=1024, text-embedding-v4=1024, text-embedding-3-small=1536
  # Standalone settings (when mode=standalone)
  host: "localhost"
  port: 19530
  # Index settings
  index_type: "IVF_FLAT"
  metric_type: "COSINE"
  index_params:
    nlist: 128

retrieval:
  top_k: 20             # Initial recall from vector search
  final_k: 5            # After reranking
  similarity_threshold: 0.3

reranker:
  provider: "dashscope"    # "bge_reranker" (local) / "openai" / "dashscope" (千问)
  model_name: "BAAI/bge-reranker-v2-m3"
  model: "qwen3-rerank"    # reranker model: gpt-4o-mini / qwen3-rerank
  device: "cpu"
  batch_size: 16

llm:
  provider: "deepseek"   # "claude" / "openai" / "deepseek"
  model: "deepseek-chat" # deepseek-v4-pro via deepseek-chat endpoint
  base_url: null         # null = default; set for custom endpoints
  temperature: 0.3
  max_tokens: 2048
  stream: false

agent:
  max_iterations: 10
  system_prompt: |
    你是一个智能知识库助手，可以通过调用工具来获取信息和回答问题。为叭嗒、漫画、小程序、插件等产品功能提供技术支持，根据提供的稳定内容回答问题。

    ## 可用工具
    - **knowledge_search**: 在知识库中搜索文档，自动完成检索和精排，返回最相关的片段及来源编号。当用户问题需要专业知识库信息时，这是首选工具。
    - **web_search**: 搜索互联网获取实时信息。仅当知识库无法回答时使用。

    ## 信息来源优先级
    每个文档片段会标注来源文件名，请据此判断权威性：
    - **ACN_cases.xlsx**：主要来源，包含测试用例和现有应用逻辑，是产品行为的权威定义。
    - **ACN_buglist.xlsx**：缺陷记录，反映已知问题和历史 Bug，用于辅助判断。
    - **以"叭嗒"、"基线"、"后端"等开头的 .xmind 文件**：产品需求脑图，用于补充背景和上下文。
    - **其他 .xmind 文件**：辅助参考。
    当不同来源信息冲突时，按以上优先级采纳。

    ## 工作流程
    1. 分析用户问题，确定需要哪些信息
    2. 如有必要，调用 knowledge_search 搜索知识库
    3. 如果知识库无法回答，尝试 web_search
    4. 综合所有信息，给出完整答案

    ## 回答规则
    - 必须引用信息来源，使用 [1]、[2] 等编号
    - 如果所有工具都无法找到答案，明确告知"根据目前的信息无法回答"
    - 答案应简洁、准确、结构化
    - 使用中文回答

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
  request_timeout: 60

logging:
  json_format: true
  level: "INFO"
